[tool.poetry]
name = "docker1"
version = "0.0.1"
description = ""
authors = ["GAP Inc"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
loguru = "^0.7.3"
fastapi = "^0.115.7"
uvicorn = "^0.34.0"
pydantic = "^2.10.6"
pandera = "^0.22.1"
joblib = "^1.4.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.4"
mypy = "^1.7.1"
pytest = "^7.4.3"
coverage = {extras=["toml"], version="^7.3.2"}
ipykernel = "^6.27.1"
faker = "^22.6.0"
ipywidgets = "^8.1.1"
pandas-stubs = "^2.1.4.231227"
types-regex = "^2023.12.25.20240106"
types-pyyaml = "^6.0.12.20240311"
types-requests = "^2.31.0.20240311"
types-pillow = "^10.2.0.20240415"


# ============================================
# ==== DO NOT CHANGE ANYTHING BELOW THIS =====
# ============================================

[[tool.poetry.source]]
name = "gap-jfrog"
url = "https://gapinc.jfrog.io/artifactory/api/pypi/pypi-repo/simple"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
# Same as Black.
line-length = 120
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", 
    "D", 
    "W", 
    "N"
]
ignore = ['D100', 'D104', 'D203', 'D205', 'D212', 'D415', 'D417']

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false


[tool.coverage.report]
fail_under = 80

[tool.mypy]
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["scripts", "docs"]
plugins = []

[tool.poetry.dev-dependencies]
pytest-socket = "*"
